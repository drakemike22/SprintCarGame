name = "sprint-car-showdown"
main = "src/cloudflare/worker.mjs"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://ubdidvqsxvrhloroyhsa.supabase.co"

[assets]
directory = "./src/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "sprint-car-showdown-db"
database_id = "8300054a-6e88-43ed-9fc6-19abd4bfd9df"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]


[observability]
enabled = true

[observability.logs]
enabled = true
